<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Garaż jednostanowiskowy - schemat wymiarów</title>
  <desc id="desc">Architektoniczny rysunek garażu jednostanowiskowego z opisem długości, szerokości i wysokości.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8f5"/>
      <stop offset="1" stop-color="#e7e9e2"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f2eb"/>
      <stop offset="1" stop-color="#ddd9ce"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d5ca"/>
      <stop offset="1" stop-color="#c5c0b5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#1d1d1f" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7f63"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1280" cy="190" r="260" fill="#ffffff" opacity="0.55"/>
  <circle cx="250" cy="860" r="320" fill="#ffffff" opacity="0.45"/>

  <g transform="translate(180 210)" filter="url(#shadow)">
    <polygon points="300,120 930,50 1180,210 550,300" fill="#b3b8b0"/>
    <polygon points="300,120 550,300 550,650 300,470" fill="url(#front)"/>
    <polygon points="550,300 1180,210 1180,560 550,650" fill="url(#side)"/>
    <polygon points="300,120 930,50 1180,210 550,300" fill="#3d342b"/>
    <polygon points="336,147 921,83 1138,218 557,296" fill="#514537"/>
    <rect x="358" y="262" width="142" height="300" rx="8" fill="#f5f2e9" stroke="#bdb7aa" stroke-width="6"/>
    <rect x="585" y="312" width="365" height="248" rx="10" fill="#5a4637"/>
    <g stroke="#7a6454" stroke-width="5">
      <line x1="610" y1="352" x2="927" y2="352"/>
      <line x1="610" y1="404" x2="927" y2="404"/>
      <line x1="610" y1="456" x2="927" y2="456"/>
      <line x1="610" y1="508" x2="927" y2="508"/>
    </g>
    <rect x="1030" y="330" width="86" height="130" rx="4" fill="#e9ece4" stroke="#9ea69b" stroke-width="5"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#1d1d1f">
    <text x="96" y="105" font-size="42" font-weight="700">Garaż jednostanowiskowy</text>
    <text x="96" y="152" font-size="23" font-weight="500" fill="#5f6368">Zakres wymiarów modułowej konstrukcji GS</text>
  </g>

  <g stroke="#6e7f63" stroke-width="4" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="455" y1="902" x2="1358" y2="780"/>
    <line x1="125" y1="682" x2="390" y2="875"/>
    <line x1="1460" y1="420" x2="1460" y2="770"/>
  </g>
  <g stroke="#6e7f63" stroke-width="2" opacity="0.8">
    <line x1="455" y1="828" x2="455" y2="925"/>
    <line x1="1358" y1="706" x2="1358" y2="804"/>
    <line x1="162" y1="630" x2="100" y2="715"/>
    <line x1="425" y1="823" x2="365" y2="910"/>
    <line x1="1420" y1="420" x2="1495" y2="420"/>
    <line x1="1420" y1="770" x2="1495" y2="770"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="760" y="820" width="330" height="70" rx="35" fill="#ffffff" opacity="0.94"/>
    <text x="925" y="849" text-anchor="middle" font-size="17" fill="#6e7f63" font-weight="700">DŁUGOŚĆ</text>
    <text x="925" y="875" text-anchor="middle" font-size="25" fill="#1d1d1f" font-weight="800">5220-5960 mm</text>

    <rect x="72" y="580" width="300" height="70" rx="35" fill="#ffffff" opacity="0.94"/>
    <text x="222" y="609" text-anchor="middle" font-size="17" fill="#6e7f63" font-weight="700">SZEROKOŚĆ</text>
    <text x="222" y="635" text-anchor="middle" font-size="25" fill="#1d1d1f" font-weight="800">2970-4080 mm</text>

    <rect x="1305" y="320" width="230" height="70" rx="35" fill="#ffffff" opacity="0.94"/>
    <text x="1420" y="349" text-anchor="middle" font-size="17" fill="#6e7f63" font-weight="700">WYSOKOŚĆ</text>
    <text x="1420" y="375" text-anchor="middle" font-size="25" fill="#1d1d1f" font-weight="800">2240 / 2420 mm</text>
  </g>
</svg>
