<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Garaż dwustanowiskowy - schemat wymiarów</title>
  <desc id="desc">Architektoniczny rysunek garażu dwustanowiskowego z opisem długości, szerokości i wysokości.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbf8"/>
      <stop offset="1" stop-color="#e6e9e1"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f0eb"/>
      <stop offset="1" stop-color="#d7d3ca"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dad6ce"/>
      <stop offset="1" stop-color="#c4beb4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#1d1d1f" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7f63"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1240" cy="160" r="280" fill="#fff" opacity="0.55"/>
  <circle cx="240" cy="820" r="320" fill="#fff" opacity="0.42"/>

  <g transform="translate(110 200)" filter="url(#shadow)">
    <polygon points="250,120 1030,40 1360,220 580,330" fill="#aeb5ad"/>
    <polygon points="250,120 580,330 580,660 250,450" fill="url(#front)"/>
    <polygon points="580,330 1360,220 1360,550 580,660" fill="url(#side)"/>
    <polygon points="250,120 1030,40 1360,220 580,330" fill="#3d342b"/>
    <polygon points="290,148 1016,78 1308,222 590,323" fill="#54483a"/>
    <rect x="360" y="286" width="255" height="258" rx="9" fill="#5a4637"/>
    <rect x="676" y="302" width="358" height="240" rx="10" fill="#5a4637"/>
    <g stroke="#7a6454" stroke-width="5">
      <line x1="385" y1="335" x2="590" y2="335"/>
      <line x1="385" y1="388" x2="590" y2="388"/>
      <line x1="385" y1="441" x2="590" y2="441"/>
      <line x1="701" y1="348" x2="1008" y2="348"/>
      <line x1="701" y1="400" x2="1008" y2="400"/>
      <line x1="701" y1="452" x2="1008" y2="452"/>
      <line x1="701" y1="504" x2="1008" y2="504"/>
    </g>
    <rect x="1112" y="325" width="92" height="125" rx="4" fill="#e9ece4" stroke="#9ea69b" stroke-width="5"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#1d1d1f">
    <text x="96" y="105" font-size="42" font-weight="700">Garaż dwustanowiskowy</text>
    <text x="96" y="152" font-size="23" font-weight="500" fill="#5f6368">Większa szerokość przy tym samym zakresie długości</text>
  </g>

  <g stroke="#6e7f63" stroke-width="4" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="360" y1="900" x2="1470" y2="745"/>
    <line x1="82" y1="675" x2="460" y2="915"/>
    <line x1="1510" y1="420" x2="1510" y2="750"/>
  </g>
  <g stroke="#6e7f63" stroke-width="2" opacity="0.8">
    <line x1="360" y1="820" x2="360" y2="925"/>
    <line x1="1470" y1="670" x2="1470" y2="770"/>
    <line x1="120" y1="620" x2="55" y2="715"/>
    <line x1="500" y1="860" x2="435" y2="950"/>
    <line x1="1470" y1="420" x2="1548" y2="420"/>
    <line x1="1470" y1="750" x2="1548" y2="750"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="760" y="820" width="330" height="70" rx="35" fill="#ffffff" opacity="0.94"/>
    <text x="925" y="849" text-anchor="middle" font-size="17" fill="#6e7f63" font-weight="700">DŁUGOŚĆ</text>
    <text x="925" y="875" text-anchor="middle" font-size="25" fill="#1d1d1f" font-weight="800">5220-5960 mm</text>

    <rect x="70" y="575" width="250" height="70" rx="35" fill="#ffffff" opacity="0.94"/>
    <text x="195" y="604" text-anchor="middle" font-size="17" fill="#6e7f63" font-weight="700">SZEROKOŚĆ</text>
    <text x="195" y="630" text-anchor="middle" font-size="25" fill="#1d1d1f" font-weight="800">5940 mm</text>

    <rect x="1335" y="320" width="230" height="70" rx="35" fill="#ffffff" opacity="0.94"/>
    <text x="1450" y="349" text-anchor="middle" font-size="17" fill="#6e7f63" font-weight="700">WYSOKOŚĆ</text>
    <text x="1450" y="375" text-anchor="middle" font-size="25" fill="#1d1d1f" font-weight="800">2240 / 2420 mm</text>
  </g>
</svg>
